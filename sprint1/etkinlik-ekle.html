<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Etkinlik Ekle</title>
</head>

<body>
    <header>
        <h1>Etkinlik Ekle</h1>
        <nav>
            <a href="index.html">Ana Sayfa</a>
            <a href="etkinlikler.html">Etkinlikler</a>
            <a href="etkinlik-detay.html">Detay</a>
            <a href="etkinlik-ekle.html">Ekle</a>
            <a href="etkinlik-guncelle.html">Güncelle</a>
        </nav>
    </header>

    <main>
        <form action="#" method="post">
            <p>
                <label for="ad">Etkinlik Adı</label><br>
                <input type="text" id="ad" name="ad" required>
            </p>

            <p>
                <label for="kategori">Kategori</label><br>
                <select id="kategori" name="kategori" required>
                    <option value="seminer">Seminer</option>
                    <option value="atolye">Atölye</option>
                    <option value="konferans">Konferans</option>
                    <option value="sosyal">Sosyal</option>
                </select>
            </p>

            <p>
                <label for="tarih">Tarih / Saat</label><br>
                <input type="datetime-local" id="tarih" name="tarih" required>
            </p>

            <p>
                <label for="aciklama">Açıklama</label><br>
                <textarea id="aciklama" name="aciklama" rows="4" cols="40"></textarea>
            </p>

            <p>
                <button type="submit">Kaydet</button>
            </p>
        </form>
    </main>

    <footer>
        <p>Batuhan Demir · 2311012023 · 2026</p>
    </footer>
</body>

</html>
